<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header-assets('Registered Students')}">
    <title>Registered Students</title>
</head>
<body>

<nav th:replace="~{fragments :: navbar('students')}"></nav>

<main class="main-wrapper">
    <div class="page-header">
        <div>
            <h1>Registered Students</h1>
            <p>List of all registered students and their associated club memberships</p>
        </div>
        <div>
            <a th:href="@{/student/register}" class="btn btn-primary btn-sm">+ Add Student</a>
        </div>
    </div>

    <div th:replace="~{fragments :: alerts}"></div>

    <div class="card" style="padding: 0; overflow: hidden;">
        <div class="data-table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">ID</th>
                        <th>Student Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th style="width: 80px;">Year</th>
                        <th>Joined Clubs</th>
                        <th style="text-align: center; width: 130px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="7" style="text-align: center; padding: 1.5rem; color: var(--text-muted);">
                            No students registered yet. <a th:href="@{/student/register}">Add student</a>.
                        </td>
                    </tr>
                    <tr th:each="st : ${students}">
                        <td th:text="${st.studentId}">1</td>
                        <td><strong th:text="${st.studentName}">Student Name</strong></td>
                        <td th:text="${st.email}">email@example.com</td>
                        <td th:text="${st.course}">B.Tech CS</td>
                        <td th:text="'Year ' + ${st.yearOfStudy}">Year 2</td>
                        <td>
                            <div th:if="${st.clubs != null && !#sets.isEmpty(st.clubs)}" style="display: flex; flex-wrap: wrap; gap: 0.25rem;">
                                <span th:each="club : ${st.clubs}" class="badge badge-dark" th:text="${club.clubName}">Club Name</span>
                            </div>
                            <span th:if="${st.clubs == null || #sets.isEmpty(st.clubs)}" style="color: var(--text-muted); font-size: 0.8rem;">None</span>
                        </td>
                        <td style="text-align: center;">
                            <a th:href="@{/student/edit(id=${st.studentId})}" class="btn btn-secondary btn-sm" style="padding: 0.15rem 0.45rem;">Edit</a>
                            <a th:href="@{/student/delete(id=${st.studentId})}" class="btn btn-danger btn-sm" style="padding: 0.15rem 0.45rem;"
                               onclick="return confirm('Delete this student?');">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
